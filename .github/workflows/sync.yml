name: Sync upstream

on:
  schedule:
    # Daily, off the hour to avoid GitHub's cron congestion.
    - cron: "17 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-changed]

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A hung clone would otherwise sit on a runner for the default six hours.
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Third-party and first-party actions alike are pinned to a commit SHA.
      # A moved tag on an action that holds contents:write would be a direct
      # path into this repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Regenerate from upstream
        id: sync
        run: node scripts/sync.mjs

      # Most upstream commits touch nothing this repository vendors, and leave
      # only .sync-state.json rewritten. A pull request for that is noise, so
      # one is opened only when generated content moved or upstream grew a skill
      # the allowlist does not cover. The state file then stays on the last
      # content sync, which only widens the commit range the next report shows.
      - name: Decide whether the change is worth a pull request
        id: changed
        env:
          # Via the environment, never interpolated into the script body.
          EXTRAS: ${{ steps.sync.outputs.extras }}
        run: |
          content=$(git status --porcelain -- . ':!.sync-state.json')
          if [ -n "$content" ] || [ "${EXTRAS:-0}" != "0" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "Only .sync-state.json changed; no pull request opened."
          fi

      # The report is passed by path, never through GITHUB_OUTPUT. It embeds
      # upstream commit subjects, and a commit subject that happened to match a
      # heredoc delimiter would otherwise let upstream write arbitrary step
      # outputs.
      - name: Open pull request
        if: steps.changed.outputs.open == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync/upstream
          # A stale sync branch should be replaced, not merged into.
          delete-branch: true
          title: "Sync skills from cursor/plugins"
          commit-message: "Sync skills from cursor/plugins"
          body-path: .sync-report.md
          labels: upstream-sync
          # Commits through the GitHub API so they arrive verified, matching the
          # signed commits on main. Only works with a bot token; a PAT would
          # still open the PR but silently stop signing.
          sign-commits: true
